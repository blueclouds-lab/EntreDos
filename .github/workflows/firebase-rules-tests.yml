name: Firebase rules security tests

on:
  push:
    branches: [review/firebase-pairs-rules-2026-10-18]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
